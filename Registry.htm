<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>NATIONAL HUMAN RESOURCE MANAGEMENT FOR TASKFORCE - NHRMT Registration & Payment-WebPage</title>
    <link rel="stylesheet" href="style (2).css">
</head>

<body>
    <div class="container">
          

        <form action="./440Donar.htm">
                <img src="Logo21.png" alt="Logo" width="200" height="70">


            <div class="row">

                <div class="col">
                    <h3 class="title">
                          <p style="text-align: left; color: black;">FGN EMPLOYMENT<p> * Register Here
                    </h3>

                    <div class="inputBox">
                        <label for="name">
                              Full Name:
                          </label>
                        <input type="text" id="name" 
                               placeholder="Enter full name" 
                               required>
                    </div>

                    <div class="inputBox">
                        <label for="email">
                              Email:
                          </label>
                        <input type="text" id="email" 
                               placeholder="Enter email address" 
                               required>
                    </div>

                    <div class="inputBox">
                        <label for="residental address">
                              Full Residental Address:
                          </label>
                        <input type="text" id="residental address" 
                               placeholder="Enter residental address" 
                               required>
                    </div>

                    <div class="inputBox">
                        <label for="country of resident">
                              Country of Resident:
                          </label>
                        <input type="text" id="country of resident" 
                               placeholder="Enter country of resident" 
                               required>
                    </div>

                    <div class="flex">

                        <div class="inputBox">
                            <label for="state">
                                  State:
                              </label>
                            <input type="text" id="state" 
                                   placeholder="Enter state" 
                                   required>
                        </div>

                        <div class="inputBox">
                            <label for="city">
                                  City:
                              </label>
                            <input type="text" id="city" 
                                   placeholder="enter city" 
                                   required>
                        </div>
                          
                    </div>
                          
                        <div class="inputBox">
                            <label for="NextofKin">
                                  Next of Kin:
                              </label>
                            <input type="text" id="nextofkin" 
                                   placeholder="enter next of kin name" 
                                   required>
                        </div>
                          
                        <div class="inputBox">
                            <label for="relationwithnextofkin">
                                  Next of Kin Relationship:
                              </label>
                            <input type="text" id="relationwithnextofkin" 
                                   placeholder="enter relationship" 
                                   required>
                        </div>
                          
                        <div class="inputBox">
                            <label for="AddressNextofKin">
                                  Address of Next of Kin:
                              </label>
                            <input type="text" id="addressnextofkin" 
                                   placeholder="enter address of next of kin" 
                                   required>
                        </div>
                          
                        <div class="inputBox">
                            <label for="NextofKingsmno">
                                  Next of Kin GSM No.:
                              </label>
                            <input type="text" id="nextofkingsmni" 
                                   placeholder="enter next of kin name gsm" 
                                   required>
                        </div>


                </div>
                <div class="col">
                    
                    <div class="inputBox">
                        
                          
    

                    <div class="inputBox">
                        <label for="PayerName">
                              Name of Payer :
                          </label>
                        <input type="text" id="Payer's Name" 
                               placeholder="Enter a payer's name - (fg'0-1')" 
                               required>
                    </div>

                    <div class="inputBox">
                        <label for="bankname">
                              Payer's Bank Name':
                          </label>
                        <input type="text" id="bankname" 
                               placeholder="Enter Payer's Bank Name" 
                               maxlength="20" required>
                    </div>
                          
                          <div class="inputBox">
                        <label for="bankname">
                              Payer's Account Number':
                          </label>
                        <input type="text" id="account-number" 
                               placeholder="Enter Payer's Account Number" 
                               maxlength="20" required>
                    </div>

                    <div class="inputBox">
                        <label for="">Holding Qualification:</label>
                        <select name="" id="">
                            <option value="">PhD</option>
                            <option value="January">MSc</option>
                            <option value="February">Bachelor</option>
                            <option value="March">HND</option>
                            <option value="April">NCE</option>
                            <option value="May">ND</option>
                            <option value="June">SSCE</option>
                        </select>
                    </div>
                                      
                    <div class="inputBox">
                            <label for="cvv">Graduation Year</label>
                            <input type="number" id="Year" 
                                   placeholder="1234" required>
                        </div>


                                      
                    <div class="flex">
                        <div class="inputBox">
                            <label for="">Graduation Month:</label>
                            <select name="" id="">
                                <option value="">Choose Month</option>
                                <option value="2023">January</option>
                                <option value="2024">February</option>
                                <option value="2025">March</option>
                                <option value="2026">April</option>
                                <option value="2027">May</option>
                                <option value="2023">June</option>
                                <option value="2024">July</option>
                                <option value="2025">August</option>
                                <option value="2026">September</option>
                                <option value="2027">October</option>
                                <option value="2026">November</option>
                                <option value="2027">December</option>
                            </select>
                        </div>
                          
                         <div class="inputBox">
                            <label for="nameinstitution">Name of Institution</label>
                            <input type="text" id="nameinsttitution" 
                                   placeholder="Name of Institution" required>
                               
                       
                    </div>
                          

                        </div>
                          <div class="inputBox">
                        <label for="">Select Placement Agency:</label>
                        <select name="" id="">
                            <option value="">Choose Ministries, Departments and Agencies</option>
                            <option value="">Nigerian Correctional/Prison Service</option>
                            <option value="">Nigerian Custom Service</option>
                            <option value="">Infrastructural Development Agency</option>
                            <option value="">Ministry of Interior</option>
                            <option value="">Ministry of Defence</option>
                            <option value="">National Drug and Law Enforcement Agency</option>
                              <option value="">Economic and Financial Crime Commission</option>
                              <option value="">Federal Inland Revenue Service</option>
                              <option value="">National Drug and Law Enforcement Agency</option>
                              <option value="">National Agency for Food and Drugs Administration and Control</option>
                              <option value="">Ministry of Justice/Jurisdication/Sharia/Law</option>
                              <option value="">Industrial and Technological Development Fund (ITF)</option>
                              <option value="">Ministry of Statistical, Programming, Computer and Computing </option>
                        
                        
                
                        
                        
                        </select>
                      
                        
                    </div>
                          <div class="inputBox">
                            <label for="fieldstudied">Specialization</label>
                            <input type="text" id="fieldstudied" 
                                   placeholder="field studied" required>
                               
                       
                           
                       

                </div>
                      
                          <div class="inputBox">
                            <label for="Skill Acquired">Acquired Skill</label>
                            <input type="text" id="acquiredskill" 
                                   placeholder="Skill Acquired" required>
                        

            </div>
                                      
                                      <div>
      <p>Upload an Evidence of Payment for your Placement Job at NHRMT:</p>
      <input type="file" id="myFile" name="filename">
    </div>

            <input type="submit" value="Proceed to Submission" 
                   class="submit_btn">
        </form>

</html>
